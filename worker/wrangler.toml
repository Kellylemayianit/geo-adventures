name = "geo-adventures-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "geo-adventures-db"
database_id = "2ee58e69-afb6-4c93-9f05-7ba5641c57d3"

[vars]
# Lock this down to your real site origin once it's deployed, e.g. "https://geoadventureskenya.com"
# Using "*" works immediately but allows any site to call the API.
ALLOWED_ORIGIN = "https://geo-adventures-api.kaelentechnologies.workers.dev/"

# WORKER_SECRET (used to sign session tokens) is NOT set here — set it with:
#   wrangler secret put WORKER_SECRET
# Never commit a real secret into this file.
