name: Deploy Site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'styles/**'
      - 'assets/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch: {}   # lets you trigger a deploy manually from the Actions tab too

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure Pages project exists (no-op once it's already created)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create geo-adventures --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=geo-adventures --branch=main --commit-dirty=true
